name: Process transcripts

on:
  push:
    branches:
      - main
    paths:
      - "transcripts/**/transcript.txt"
  workflow_dispatch:
    inputs:
      model:
        description: Claude model alias or model ID
        required: false
        default: sonnet
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: archivist-transcript-processing
  cancel-in-progress: false

jobs:
  process-transcripts:
    name: Process pending transcripts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Find pending transcripts
        id: pending
        shell: bash
        run: |
          if find transcripts -mindepth 3 -maxdepth 3 -type f -name transcript.txt -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No pending transcripts were found."
          fi

      - name: Process pending transcripts
        if: steps.pending.outputs.found == 'true'
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ARCHIVIST_MODEL: ${{ inputs.model || 'sonnet' }}
        run: |
          set -euo pipefail

          if [[ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "::error::The CLAUDE_CODE_OAUTH_TOKEN repository secret is not configured."
            exit 1
          fi

          mapfile -d '' -t transcript_files < <(
            find transcripts -mindepth 3 -maxdepth 3 -type f -name transcript.txt -print0 | sort -z
          )

          for transcript_file in "${transcript_files[@]}"; do
            echo "Processing $transcript_file"
            python -m archivist process "$transcript_file" --model "$ARCHIVIST_MODEL"
          done

      - name: Commit generated reports
        if: steps.pending.outputs.found == 'true'
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          branch="automation/process-transcripts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- transcripts archived output

          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Processing produced no repository changes."
            exit 0
          fi

          git commit -m "chore: process pending transcripts"
          git push origin "HEAD:$branch"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open review pull request
        if: steps.commit.outputs.created == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          gh pr create \
            --base main \
            --head "$HEAD_BRANCH" \
            --title "chore: process pending transcripts" \
            --body "Automated transcript processing from GitHub Actions run $GITHUB_RUN_ID. Review the generated reports and archived transcript changes before merging." \
            --draft

